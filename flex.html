
<!DOCTYPE html>
<html>
<head>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            <!-- if you want to change the direction of the flex items, you can use flex-direction property. The default value is row, but you can set it to column, row-reverse, or column-reverse. -->
            justify-content: center;
            align-items: center;
            height: 300px;
            background-color: lightgray;
        }

        .box {
            background-color: skyblue;
            padding: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box">I am centered!</div>
        <div class="box">I am also centered!</div>
        <div class="box">I am yet another centered element!</div>
    </div>


</body>
</html>

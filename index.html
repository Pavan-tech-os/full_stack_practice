
<!DOCTYPE html>
<html>
<head>
    <title>My First Interactive Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: blue;
        }

        button {
            background-color: blue;
            color: white;
            padding: 12px 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- HTML: Create elements -->
    <h1 id="heading">Hello Student!</h1>

    <button id="btn">Click Me</button>

    <!-- JavaScript: Add behavior -->
    <script>
        let h = document.getElementById("heading");
        let b = document.getElementById("btn");

        b.addEventListener("click", function() {
            h.textContent = "Welcome to JavaScript!";
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            background-color: orange;
            padding: 20px;
        }

        .b1 {
            background-color: green;
            padding: 50px;
            text-align: left;
        }
        .b2 {
            background-color: blue;
            padding: 50px;
            text-align: center;
        }
        .b3 {
            background-color: red;
            padding: 50px;
            text-align: right;
        }
        .fc {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 300px;
            background-color: lightgray;
        }
        .box1 {
            background-color: skyblue;
            padding: 30px;
            width: 100%;
            text-align: center;
        }
        .footer {
            background-color: lightgray;
            padding: 20px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>
</body>
<div class="fc">
    <div class="box1">header</div>
    <div  class="container">
        <div class="b1">I am left aligned!</div>
        <div class="b2">I am center aligned!</div>
        <div class="b3">I am right aligned!</div>
    </div>
    <div class="footer">footer</div>
    </div>
</body>
</html>
